services:
  - type: web
    name: autodiag-ai-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn src.api.wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
